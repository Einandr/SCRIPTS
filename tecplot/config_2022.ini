[file]
# Имена файлов
case = save-0.cas
data_start = save-8-0.050040.dat
data_end = save-8-0.054960.dat

[mode]
calculate_thrust = no
export_movie = yes
export_images = yes
export_spray = no
minimal_mode = no					# расчёт только для определения полноты
brutto_kinetics = no				# если расчёт брутто кинетики - отключается вычисление полноты по энтальпии и вывод соответствующих графиков
equilibrium_info = no				# вывод графиков равновесного состава и температуры по данным CHEMKIN - используется только справочно!
show_etta_energetic = yes			# нужно ли показывать график энергетической полноты (актуально для брутто-кинетики)
show_etta_fuel = yes				# нужно ли показывать график полноты по концентрации топлива
movie_all_frames_at_once = no		# режим записи видео - все фреймы в одном фильме или несколько разных фильмов

[path]
# Пути к рабочим файлам
chemkin = D:\Simulation\!Python_CIAM\2_Comb_DES\kinetics\kerosene_air_14comp\chemkin_kerosene_air_14comp.txt
thermo = D:\Simulation\!Python_CIAM\2_Comb_DES\kinetics\kerosene_air_14comp\thermo_kerosene_air_14comp.db
work_dir_case_data = \\fs\works\2018\029\K14_D71_P_S2-40\a087\
work_dir = D:\Simulation\!TECPLOT_MACRO\PYTECPLOT\Result_2019\Stupa\

[geom]
# Особенности геометрии
n_zones = 5 				# число зон в кейсе, включая 1 объемную и остальные границы (стенки, вход, выход)
n_cross_sections = 100		# число промежуточных поперечных сечений для записи графиков по длине
n_cross_show = 15       	# число промежуточных поперечных сечений для отображения
x_cross_start = 0.001   	# координата начального поперечного сечения
x_cross_end = 1.4       	# координата конечного поперечного сечения
x_cross_out = 1.148     	# координата поперечного сечения для замера тяги
slice_position = 0.00   	# координата продольного сечения
n_injectors = 16			# число инжекторов - НУЖНО И ДЛЯ КАРТИНОК РАСПЫЛА, И ДЛЯ ОСРЕДНЕННЫХ ГРАФИКОВ ПОЛНОТЫ!
delta_ts = 0.00004  		# шаг по времени между сохранениями
rotation = 25, -128, 125	# углы поворота модели

[zones]
# Настройка прозрачности зон. Не задаётся ничего если нет, одиночное значение если одна зона, через запятую если много зон
zones_transparent = 3
zones_wall = 4, 5
zones_show = 3
zones_oblique = 

[variables]
# Выбор переменных для отображения на картинках
variables_plot = 'T', 'Pressure', 'Velocity', 'Mach'
variables_legend = 'T (K)', 'P (Па)', 'V (м/с)', 'M'							
variables_min = 0, 0, 0, 0													
variables_max = 3000, 800000, 750, 2										
variables_inc = 250, 100000, 50, 0.2
# C11H21 / O2 H2 CO2 H2O N2O / CH OH NO CO / N O H / N2											
species_plot = 'C11H21', 'O2', 'CO2', 'H2O', 'NO', 'O', 'CO', 'OH'		# Массовые доли каких компонент отображать
frames_dim = 3, 4														# Размерность должна соответствовать количеству переменных

[Y_max]
y_max = 0.2, 0.24, 0.18, 0.2, 0.002, 0.001, 0.18, 0.005

[var_number]
# minimal_mode
x 					= 1
p_stat 				= 4
Y_start 			= 59
t_stat 				= 59		# + n_species
mfr 				= 60		# + n_species
mfr_species 		= 61		# + n_species
# Расчёт ГДФ - вычисление числа Маха и полных T P
v 					= 61		# + n_species * 2
mach 				= 65		# + n_species * 2
t_tot 				= 68		# + n_species * 3
p_tot 				= 69		# + n_species * 3
Ro_Vx_Enthalpy_0 	= 70		# + n_species * 3
Ro_Vx_Vx 			= 71		# + n_species * 3
# Номер переменной при загрузке дат поочередно для определения тяги
Ro_Vx_Vx_Group 		= 59		# + n_species * 4

[average]
mfr_fuel_inj = 0.0085																		# расход топлива через один инжектор
folder_equilibrium_state = D:\Simulation\!TECPLOT_MACRO\PYTECPLOT\RESULTS\					# путь к файлу равновесного состава
file_equilibrium_state = Tg-900_Tf-300_Stupa.xlsx											# файл равновесного состава, насчитанный из chemkin
work_path = D:\Simulation\!TECPLOT_MACRO\PYTECPLOT\Result_2019\T900_D71_P\a087\				# СЛЭШ в конце обязательно!!!
# Массовый состав газа на входе. Последний компонент вычисляется как 1-сумма остальных
Species_in = 'O2', 'CO2', 'H2O', 'N2'
Y_in = 0.2317, 0.0004, 0.0505
oxidizer = O2
fuel = C11H21
products = 'CO2', 'H2O'
n_offset = 25                       # в каком сечении измеряется расход - ВАЖНО при определении альфа
n_output = 25                       # в каком сечении измеряются параметры на выходе
n_thrust = 20						# в каком сечении измеряется тяга
# выбор интервала осреднения - обрезка слева и справа
average_left = 0					
average_right = 0
# границы расчетной области
x_min = 0.076
x_max = 1.12
x_throat = 1.148					# НЕ ЗНАЮ ЗАЧЕМ НАДО
x_inj = 0.35                 		# Координата расположения инжекторов - при отображении полноты левее этой точки будет 0
# максимальные значения на графиках
t_equil = 2800			# равнове
y_equil = 0.25			# равновесные концентрации (смежная ось)
y_main = 0.3			# массовая доля основных компонент
mfr_fuel = 0.3          # расход топлива
etta = 1.2				# полнота сгорания (смежная ось)
# Имена переменных в таблице равновесного состояния
name_mfr_oxidant = Inlet_flow_rate_of_C1_Inlet2_(kg/sec)
name_mfr_fuel = Inlet_flow_rate_of_C1_Inlet1_(kg/sec)
name_temperature = Temperature_(K)
equilibrium_empty_components = 'CH'								# ЗАГЛУШКА - каких компонент нет в равновесных продуктах при любом альфа
plot_y_main_equil = 'O2', 'CO2', 'CO', 'H2O'
bulk_species = 'N2'
plot_y_main = 'O2', 'CO2', 'H2O', 'CO'
plot_y_minor = 'OH', 'NO', 'O', 'H2'
plot_y_minor_twin = 'N2O', 'CH', 'N'







